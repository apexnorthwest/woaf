[package]
name = "woaf"
version = "0.1.0"
edition = "2024"
authors = ["Tyler Bevan <tyler.bevan@apexnorthwest.com>"]
description = "Offer and Accept files over HTTP/S anywhere you have a terminal!"
readme = "README.md"
repository = "https://github.com/apexnorthwest/woaf"
homepage = "https://github.com/apexnorthwest/woaf"
license = "Apache-2.0"
exclude = [".github", "target/", ".*"]
default-run = "woaf"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.5", features = ["derive"] }
hyper = { version = "1.11.0", features = ["full"] }
hyper-rustls = { version = "0.27.9", features = ["http2"] }
hyper-util = { version = "0.1.20", features = ["full"] }
libarchive2 = "0.2.1"
rand = "0.10.2"
rustls = "0.23.43"
serde = {version = "1.0.229", features = ["std", "derive"]}
tempfile = {version = "3.27.0", features=["getrandom"]}
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
toml = {version = "1.1.4", features=["parse", "serde", "std"]}

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
